<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beauty-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#e8789b;
    --rose-dark:#c4457a;
    --blush:#fde8ee;
    --cream:#fff8f5;
    --gold:#c9a063;
    --ink:#4a2a38;
    --muted:#8a6b78;
    --ok:#3f9c7a;
    --ok-bg:#e3f5ee;
    --bad:#d6475f;
    --bad-bg:#fde6ea;
    --card:#ffffff;
    --shadow:0 18px 50px rgba(196,69,122,.18);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px 16px;
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 15%,#ffd6e3 0,transparent 38%),
      radial-gradient(circle at 88% 85%,#f7e1c4 0,transparent 36%),
      linear-gradient(160deg,var(--cream),var(--blush));
    background-attachment:fixed;
  }
  .card{
    width:100%;
    max-width:560px;
    background:var(--card);
    border-radius:28px;
    padding:36px 32px 32px;
    box-shadow:var(--shadow);
    border:1px solid rgba(201,160,99,.35);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:6px;
    background:linear-gradient(90deg,var(--rose),var(--gold),var(--rose-dark));
  }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.22em;
    font-size:12px;
    color:var(--gold);
    font-weight:600;
    margin:0 0 8px;
    text-align:center;
  }
  h1,h2{
    font-family:'Playfair Display',Georgia,serif;
    text-align:center;
    margin:0;
    line-height:1.25;
    color:var(--rose-dark);
  }
  h1{font-size:clamp(32px,8vw,44px)}
  h2{font-size:clamp(21px,5vw,26px);color:var(--ink);margin:18px 0 22px}
  .emoji{font-size:54px;text-align:center;display:block;margin-bottom:6px}
  .lead{text-align:center;color:var(--muted);line-height:1.6;margin:14px 0 28px}
  .hidden{display:none !important}

  .btn{
    display:block;
    width:100%;
    font:inherit;
    font-weight:600;
    letter-spacing:.03em;
    border:0;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,var(--rose),var(--rose-dark));
    padding:15px 24px;
    border-radius:999px;
    box-shadow:0 10px 24px rgba(196,69,122,.35);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(196,69,122,.42)}
  .btn:focus-visible,.answer:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  .progress-wrap{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);font-weight:500}
  .progress{flex:1;height:8px;background:var(--blush);border-radius:99px;overflow:hidden}
  .progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:99px;transition:width .4s ease}
  .score-live{white-space:nowrap}

  .answers{display:grid;gap:12px}
  .answer{
    font:inherit;
    text-align:left;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:14px 18px;
    background:var(--cream);
    color:var(--ink);
    border:2px solid #f3d3dd;
    border-radius:18px;
    cursor:pointer;
    transition:border-color .15s,background .15s,transform .15s;
  }
  .answer:hover:not(:disabled){border-color:var(--rose);background:var(--blush);transform:translateX(3px)}
  .answer:disabled{cursor:default}
  .letter{
    flex:none;
    width:32px;height:32px;
    border-radius:50%;
    display:grid;place-items:center;
    background:#fff;
    border:2px solid #f3d3dd;
    font-weight:600;
    font-size:14px;
    color:var(--rose-dark);
  }
  .answer.correct{background:var(--ok-bg);border-color:var(--ok)}
  .answer.correct .letter{background:var(--ok);border-color:var(--ok);color:#fff}
  .answer.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .answer.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
  .answer.dim{opacity:.55}

  .feedback{
    margin-top:20px;
    padding:16px 18px;
    border-radius:16px;
    line-height:1.55;
    font-size:15px;
    animation:pop .3s ease;
  }
  .feedback strong{display:block;font-size:17px;margin-bottom:4px}
  .feedback.ok{background:var(--ok-bg);color:#24634d}
  .feedback.no{background:var(--bad-bg);color:#8d2a3d}
  #nextBtn{margin-top:18px}

  .result-score{
    font-family:'Playfair Display',Georgia,serif;
    font-size:64px;
    font-weight:700;
    text-align:center;
    color:var(--rose-dark);
    margin:10px 0 0;
  }
  .result-score small{font-size:28px;color:var(--gold)}
  .stars{text-align:center;font-size:30px;letter-spacing:6px;margin:6px 0 4px}

  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (max-width:420px){.card{padding:32px 20px 24px}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<main class="card">

  <!-- Startbildschirm -->
  <section id="start">
    <span class="emoji" aria-hidden="true">💄</span>
    <p class="eyebrow">Das Spiel für Beauty-Fans</p>
    <h1>Kosmetik-Quiz</h1>
    <p class="lead">Wie gut kennst du dich mit Pflege, Make-up und Hautwissen aus?<br>5 Fragen, 3 Antworten – nur eine ist richtig. Viel Spaß!</p>
    <button class="btn" id="startBtn" type="button">Quiz starten ✨</button>
  </section>

  <!-- Frage -->
  <section id="game" class="hidden">
    <div class="progress-wrap">
      <span id="counter">Frage 1 von 5</span>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <span class="score-live" id="scoreLive">⭐ 0</span>
    </div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <div id="feedback" aria-live="polite"></div>
    <button class="btn hidden" id="nextBtn" type="button">Weiter</button>
  </section>

  <!-- Ergebnis -->
  <section id="result" class="hidden">
    <span class="emoji" id="resultEmoji" aria-hidden="true">🌸</span>
    <p class="eyebrow">Dein Ergebnis</p>
    <h1 id="resultTitle"></h1>
    <p class="result-score"><span id="finalScore">0</span><small> / 5 Punkte</small></p>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <p class="lead" id="resultText"></p>
    <button class="btn" id="restartBtn" type="button">Nochmal spielen 💅</button>
  </section>

</main>

<script>
  const questions = [
    {
      q: "Welchen Lichtschutzfaktor (LSF) sollte eine Tagescreme fürs Gesicht mindestens haben, um die Haut täglich gut zu schützen?",
      a: ["LSF 5", "LSF 30", "LSF 2"],
      correct: 1,
      info: "Ab LSF 30 ist die Haut gut vor UVB-Strahlen geschützt – das beugt auch vorzeitiger Hautalterung vor."
    },
    {
      q: "Welcher Inhaltsstoff kann sehr viel Feuchtigkeit binden und ist deshalb in vielen Feuchtigkeitsseren enthalten?",
      a: ["Hyaluronsäure", "Alkohol", "Talkum"],
      correct: 0,
      info: "Hyaluronsäure kann ein Vielfaches ihres Eigengewichts an Wasser speichern und polstert die Haut von innen auf."
    },
    {
      q: "Was solltest du abends vor dem Schlafengehen immer tun?",
      a: ["Noch mehr Puder auftragen", "Die Haare toupieren", "Make-up gründlich entfernen"],
      correct: 2,
      info: "Über Nacht regeneriert sich die Haut. Reste von Make-up und Schmutz verstopfen die Poren und können Unreinheiten verursachen."
    },
    {
      q: "Wofür verwendet man einen Concealer?",
      a: ["Zum Färben der Wimpern", "Zum Abdecken von Augenringen und kleinen Unreinheiten", "Zum Entfernen von Nagellack"],
      correct: 1,
      info: "Concealer ist stärker deckend als Foundation und kaschiert gezielt Schatten, Rötungen und Pickelchen."
    },
    {
      q: "Wie oft solltest du deine Make-up-Pinsel und Schwämmchen etwa reinigen?",
      a: ["Nie – das ist nicht nötig", "Einmal im Jahr", "Ungefähr einmal pro Woche"],
      correct: 2,
      info: "Auf ungewaschenen Pinseln sammeln sich Talg, Make-up-Reste und Bakterien. Das kann die Haut reizen und Unreinheiten fördern."
    }
  ];

  const results = [
    { min: 0, emoji: "🌱", title: "Beauty-Einsteigerin", text: "Ein guter Anfang! Mit ein bisschen Übung wirst du bald zur Pflege-Expertin. Probier es gleich nochmal!" },
    { min: 2, emoji: "🌸", title: "Pflege-Talent", text: "Du weißt schon einiges über Kosmetik. Mit etwas mehr Wissen wirst du bald zum echten Profi." },
    { min: 4, emoji: "💖", title: "Kosmetik-Expertin", text: "Wow, sehr stark! Du kennst dich richtig gut mit Pflege und Make-up aus." },
    { min: 5, emoji: "👑", title: "Beauty-Queen", text: "Perfekt! Alle Fragen richtig – du bist eine absolute Kosmetik-Königin!" }
  ];

  const $ = id => document.getElementById(id);
  const screens = { start: $("start"), game: $("game"), result: $("result") };
  let current = 0;
  let score = 0;
  let answered = false;

  function show(name){
    Object.entries(screens).forEach(([key, el]) => el.classList.toggle("hidden", key !== name));
  }

  function startGame(){
    current = 0;
    score = 0;
    show("game");
    renderQuestion();
  }

  function renderQuestion(){
    const item = questions[current];
    answered = false;
    $("counter").textContent = `Frage ${current + 1} von ${questions.length}`;
    $("bar").style.width = `${(current / questions.length) * 100}%`;
    $("scoreLive").textContent = `⭐ ${score}`;
    $("question").textContent = item.q;
    $("feedback").innerHTML = "";
    $("nextBtn").classList.add("hidden");

    const box = $("answers");
    box.innerHTML = "";
    item.a.forEach((text, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "answer";
      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = "ABC"[i];
      const label = document.createElement("span");
      label.textContent = text;
      btn.append(letter, label);
      btn.addEventListener("click", () => choose(i));
      box.append(btn);
    });
  }

  function choose(i){
    if (answered) return;
    answered = true;
    const item = questions[current];
    const isRight = i === item.correct;
    if (isRight) score++;

    [...$("answers").children].forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === item.correct) btn.classList.add("correct");
      else if (idx === i) btn.classList.add("wrong");
      else btn.classList.add("dim");
    });

    $("scoreLive").textContent = `⭐ ${score}`;
    $("feedback").innerHTML = isRight
      ? `<div class="feedback ok"><strong>✅ Richtig!</strong>${item.info}</div>`
      : `<div class="feedback no"><strong>❌ Leider falsch.</strong>Richtig ist: „${item.a[item.correct]}“. ${item.info}</div>`;

    const next = $("nextBtn");
    next.textContent = current === questions.length - 1 ? "Ergebnis anzeigen 🎀" : "Nächste Frage →";
    next.classList.remove("hidden");
    next.focus();
  }

  function next(){
    if (current < questions.length - 1){
      current++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  function showResult(){
    const r = [...results].reverse().find(x => score >= x.min);
    $("resultEmoji").textContent = r.emoji;
    $("resultTitle").textContent = r.title;
    $("finalScore").textContent = score;
    $("resultText").textContent = r.text;
    $("stars").textContent = "★".repeat(score) + "☆".repeat(questions.length - score);
    show("result");
  }

  $("startBtn").addEventListener("click", startGame);
  $("nextBtn").addEventListener("click", next);
  $("restartBtn").addEventListener("click", startGame);
</script>
</body>
</html>
